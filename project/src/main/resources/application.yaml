spring:
  application:
    name: project

  security:
    user:
      name: admin
      password: 123

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/da3}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  liquibase:
    enabled: false
  
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJwtAuthenticationProject2026VeryLongKey}
    expiration: ${JWT_EXPIRATION:86400000}

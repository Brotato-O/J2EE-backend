spring:
  application:
    name: project
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dacn}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:0}
  
  jwt:
    secret: ${JWT_SECRET:} 
    expiration: ${JWT_EXPIRATION:86400000}

app:
  ghn:
    enabled: ${GHN_ENABLED:false}
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn}
    api-token: ${GHN_API_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    create-order-url: ${GHN_CREATE_ORDER_URL:/shiip/public-api/v2/shipping-order/create}
    detail-order-url: ${GHN_DETAIL_ORDER_URL:/shiip/public-api/v2/shipping-order/detail}
    cancel-order-url: ${GHN_CANCEL_ORDER_URL:/shiip/public-api/v2/switch-status/cancel}
    webhook-secret: ${GHN_WEBHOOK_SECRET:}
    from-name: ${GHN_FROM_NAME:}
    from-phone: ${GHN_FROM_PHONE:}
    from-address: ${GHN_FROM_ADDRESS:}
    from-ward-name: ${GHN_FROM_WARD_NAME:}
    from-district-name: ${GHN_FROM_DISTRICT_NAME:}
    from-province-name: ${GHN_FROM_PROVINCE_NAME:}
    service-type-id: ${GHN_SERVICE_TYPE_ID:2}
    payment-type-id: ${GHN_PAYMENT_TYPE_ID:1}
    required-note: ${GHN_REQUIRED_NOTE:KHONGCHOXEMHANG}
    default-weight-grams: ${GHN_DEFAULT_WEIGHT_GRAMS:500}
    default-length-cm: ${GHN_DEFAULT_LENGTH_CM:20}
    default-width-cm: ${GHN_DEFAULT_WIDTH_CM:15}
    default-height-cm: ${GHN_DEFAULT_HEIGHT_CM:10}
    connect-timeout: ${GHN_CONNECT_TIMEOUT:3s}
    read-timeout: ${GHN_READ_TIMEOUT:10s}
    max-attempts: ${GHN_MAX_ATTEMPTS:3}
  vietqr:
    enabled: ${VIETQR_ENABLED:false}
    api-base-url: ${VIETQR_API_BASE_URL:}
    api-token: ${VIETQR_API_TOKEN:}
    secret-key: ${VIETQR_SECRET_KEY:}
    bank-bin: ${VIETQR_BANK_BIN:}
    bank-account: ${VIETQR_BANK_ACCOUNT:}
    account-name: ${VIETQR_ACCOUNT_NAME:}
    terminal-code: ${VIETQR_TERMINAL_CODE:}
    qr-image-url-template: ${VIETQR_QR_IMAGE_URL_TEMPLATE:https://img.vietqr.io/image/{bankBin}-{accountNumber}-compact2.png?amount={amount}&addInfo={reference}&accountName={accountName}}
    webhook-secret: ${VIETQR_WEBHOOK_SECRET:}
    expiration: ${VIETQR_EXPIRATION:PT15M}
  vnpay:
    enabled: ${VNPAY_ENABLED:false}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL}
    ipn-url: ${VNPAY_IPN_URL}
    expiration: ${VNPAY_EXPIRATION:PT15M}

